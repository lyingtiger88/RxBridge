name: Test Builds - Web Android iOS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-test:
    name: Web / Static package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check static assets
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s pricing.js
          node --check app.js
          node --check pricing.js
      - name: Package website
        run: zip -r rxbridge-web-test.zip index.html styles.css app.js pricing.js README.md docs
      - uses: actions/upload-artifact@v4
        with:
          name: RxBridge-Web-Test
          path: rxbridge-web-test.zip

  android-test:
    name: Android / Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.2"
          channel: stable
          cache: true
      - name: Bootstrap Flutter platforms
        run: |
          flutter create --platforms=android,ios --project-name rxbridge apps/mobile
      - name: Set app display name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          import re
          manifest = Path("apps/mobile/android/app/src/main/AndroidManifest.xml")
          xml = manifest.read_text()
          app = re.search(r'<application\b[^>]*>', xml, re.DOTALL)
          if app is None:
              raise SystemExit("Android application element was not found")
          tag = app.group(0)
          tag, count = re.subn(r'android:label="[^"]*"', 'android:label="پل سلامت"', tag, count=1)
          if count == 0:
              tag = tag[:-1] + ' android:label="پل سلامت">'
          manifest.write_text(xml[:app.start()] + tag + xml[app.end():])
          plist_path = Path("apps/mobile/ios/Runner/Info.plist")
          with plist_path.open("rb") as source:
              info = plistlib.load(source)
          info["CFBundleDisplayName"] = "پل سلامت"
          with plist_path.open("wb") as target:
              plistlib.dump(info, target)
          PY
          test -f apps/mobile/lib/main.dart
          test -f apps/mobile/test/widget_test.dart
          python3 apps/mobile/tool/configure_notifications.py
          cd apps/mobile
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      - name: Build Android debug APK
        run: cd apps/mobile && flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: RxBridge-Android-Debug-APK
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  android-selfsigned-test:
    name: Android / Self-signed test APK (not for production updates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.2"
          channel: stable
          cache: true
      - name: Bootstrap Flutter Android project
        run: flutter create --platforms=android --project-name rxbridge apps/mobile
      - name: Configure app label and dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("apps/mobile/android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          s,n=re.subn(r'android:label="[^"]+"','android:label="پل سلامت"',s,count=1)
          if n == 0: raise SystemExit("Android app label not found")
          p.write_text(s)
          PY
          python3 apps/mobile/tool/configure_notifications.py
          cd apps/mobile
          flutter pub get
          flutter test
      - name: Build Android test APK
        run: cd apps/mobile && flutter build apk --debug
      - name: Re-sign APK with a temporary BDFR test key and verify
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          mkdir -p out/signing
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/rxbridge-test.jks" -storetype JKS -storepass "$GITHUB_RUN_ID" -keypass "$GITHUB_RUN_ID" -alias rxbridge-test -keyalg RSA -keysize 3072 -validity 3650 -dname "CN=BDFR Test Publisher"
          "$BUILD_TOOLS/zipalign" -f 4 apps/mobile/build/app/outputs/flutter-apk/app-debug.apk "$RUNNER_TEMP/rxbridge-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/rxbridge-test.jks" --ks-key-alias rxbridge-test --ks-pass "pass:$GITHUB_RUN_ID" --key-pass "pass:$GITHUB_RUN_ID" --out out/RxBridge-Android-SelfSigned-Test.apk "$RUNNER_TEMP/rxbridge-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs out/RxBridge-Android-SelfSigned-Test.apk
          keytool -exportcert -rfc -keystore "$RUNNER_TEMP/rxbridge-test.jks" -storepass "$GITHUB_RUN_ID" -alias rxbridge-test -file out/signing/BDFR-RxBridge-Test-Certificate.pem
          sha256sum out/RxBridge-Android-SelfSigned-Test.apk | tee out/signing/SHA256SUMS.txt
          rm -f "$RUNNER_TEMP/rxbridge-test.jks" "$RUNNER_TEMP/rxbridge-aligned.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: RxBridge-Android-SelfSigned-Test
          path: out/**
          if-no-files-found: error
          retention-days: 30

  ios-test:
    name: iOS / Unsigned Simulator
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.2"
          channel: stable
          cache: true
      - name: Bootstrap Flutter platforms
        run: |
          flutter create --platforms=android,ios --project-name rxbridge apps/mobile
      - name: Set app display name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          import re
          manifest = Path("apps/mobile/android/app/src/main/AndroidManifest.xml")
          xml = manifest.read_text()
          app = re.search(r'<application\b[^>]*>', xml, re.DOTALL)
          if app is None:
              raise SystemExit("Android application element was not found")
          tag = app.group(0)
          tag, count = re.subn(r'android:label="[^"]*"', 'android:label="پل سلامت"', tag, count=1)
          if count == 0:
              tag = tag[:-1] + ' android:label="پل سلامت">'
          manifest.write_text(xml[:app.start()] + tag + xml[app.end():])
          plist_path = Path("apps/mobile/ios/Runner/Info.plist")
          with plist_path.open("rb") as source:
              info = plistlib.load(source)
          info["CFBundleDisplayName"] = "پل سلامت"
          with plist_path.open("wb") as target:
              plistlib.dump(info, target)
          PY
          python3 apps/mobile/tool/configure_notifications.py
          cd apps/mobile
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      - name: Build iOS simulator (unsigned)
        run: cd apps/mobile && flutter build ios --simulator --debug
      - name: Package iOS simulator app
        run: |
          cd apps/mobile/build/ios/iphonesimulator
          zip -qr "$GITHUB_WORKSPACE/rxbridge-ios-simulator.zip" Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: RxBridge-iOS-Simulator-Unsigned
          path: rxbridge-ios-simulator.zip
          if-no-files-found: error
