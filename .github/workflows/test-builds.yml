name: Test Builds - Web Android iOS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-test:
    name: Web / Static package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check static assets
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s pricing.js
          node --check app.js
          node --check pricing.js
      - name: Package website
        run: zip -r rxbridge-web-test.zip index.html styles.css app.js pricing.js README.md docs
      - uses: actions/upload-artifact@v4
        with:
          name: RxBridge-Web-Test
          path: rxbridge-web-test.zip

  android-test:
    name: Android / Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bootstrap Flutter platforms
        run: |
          flutter create --platforms=android,ios --project-name rxbridge apps/mobile
      - name: Set app display name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          import re
          manifest = Path("apps/mobile/android/app/src/main/AndroidManifest.xml")
          xml = manifest.read_text()
          xml, count = re.subn(r'android:label="[^"]+"', 'android:label="پل سلامت"', xml, count=1)
          if count == 0:
              raise SystemExit("Android app label was not found")
          manifest.write_text(xml)
          plist_path = Path("apps/mobile/ios/Runner/Info.plist")
          with plist_path.open("rb") as source:
              info = plistlib.load(source)
          info["CFBundleDisplayName"] = "پل سلامت"
          with plist_path.open("wb") as target:
              plistlib.dump(info, target)
          PY
          test -f apps/mobile/lib/main.dart
          test -f apps/mobile/test/widget_test.dart
          cd apps/mobile
          flutter pub get
          flutter analyze
          flutter test
      - name: Build Android debug APK
        run: cd apps/mobile && flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: RxBridge-Android-Debug-APK
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  ios-test:
    name: iOS / Unsigned Simulator
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bootstrap Flutter platforms
        run: |
          flutter create --platforms=android,ios --project-name rxbridge apps/mobile
      - name: Set app display name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          import re
          manifest = Path("apps/mobile/android/app/src/main/AndroidManifest.xml")
          xml = manifest.read_text()
          xml, count = re.subn(r'android:label="[^"]+"', 'android:label="پل سلامت"', xml, count=1)
          if count == 0:
              raise SystemExit("Android app label was not found")
          manifest.write_text(xml)
          plist_path = Path("apps/mobile/ios/Runner/Info.plist")
          with plist_path.open("rb") as source:
              info = plistlib.load(source)
          info["CFBundleDisplayName"] = "پل سلامت"
          with plist_path.open("wb") as target:
              plistlib.dump(info, target)
          PY
          cd apps/mobile
          flutter pub get
          flutter analyze
          flutter test
      - name: Build iOS simulator (unsigned)
        run: cd apps/mobile && flutter build ios --simulator --debug
      - name: Package iOS simulator app
        run: |
          cd apps/mobile/build/ios/iphonesimulator
          zip -qr "$GITHUB_WORKSPACE/rxbridge-ios-simulator.zip" Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: RxBridge-iOS-Simulator-Unsigned
          path: rxbridge-ios-simulator.zip
          if-no-files-found: error
