name: RxBridge Android signed release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-signed-release.yml"
      - "apps/mobile/**"

permissions:
  contents: read

jobs:
  android-signed:
    name: Build and sign Android APK with persistent BDFR identity
    runs-on: ubuntu-latest
    env:
      PFX_BASE64: ${{ secrets.BDFR_CODESIGN_PFX_BASE64 }}
      PFX_PASSWORD: ${{ secrets.BDFR_CODESIGN_PFX_PASSWORD }}
      EXPECTED_THUMBPRINT: ${{ secrets.BDFR_CODESIGN_THUMBPRINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.2"
          channel: stable
          cache: true
      - name: Verify BDFR PFX and extract Android signing identity
        shell: bash
        run: |
          set -euo pipefail
          for name in PFX_BASE64 PFX_PASSWORD EXPECTED_THUMBPRINT; do
            if [[ -z "${!name:-}" ]]; then echo "::error::Missing secret: $name"; exit 1; fi
          done
          printf '%s' "$PFX_BASE64" | base64 --decode > "$RUNNER_TEMP/bdfr-codesign.pfx"
          chmod 600 "$RUNNER_TEMP/bdfr-codesign.pfx"
          if ! keytool -list -v -storetype PKCS12 -keystore "$RUNNER_TEMP/bdfr-codesign.pfx" -storepass "$PFX_PASSWORD" > "$RUNNER_TEMP/pfx-info.txt" 2>&1; then
            echo "::error::PFX could not be opened by keytool. Check that PFX_BASE64 is the complete Base64 export and PFX_PASSWORD is the matching export password."
            sed -E 's/(password|passphrase)[^:]*:.*/\\1: [redacted]/Ig' "$RUNNER_TEMP/pfx-info.txt" | tail -n 8
            exit 1
          fi
          ALIAS="$(sed -n 's/^Alias name: //p' "$RUNNER_TEMP/pfx-info.txt" | head -n1)"
          CERT_THUMBPRINT="$(sed -n 's/^[[:space:]]*SHA1: //p' "$RUNNER_TEMP/pfx-info.txt" | head -n1 | tr -d '[:space:]:')"
          if [[ -z "$ALIAS" || -z "$CERT_THUMBPRINT" ]]; then
            echo "::error::Could not read BDFR PKCS12 certificate identity."
            exit 1
          fi
          keytool -exportcert -rfc -storetype PKCS12 -keystore "$RUNNER_TEMP/bdfr-codesign.pfx" -storepass "$PFX_PASSWORD" -alias "$ALIAS" -file "$RUNNER_TEMP/bdfr-certificate.pem"
          openssl x509 -in "$RUNNER_TEMP/bdfr-certificate.pem" -outform DER -out "$RUNNER_TEMP/bdfr-certificate.der"
          CERT_SHA="$(sha256sum "$RUNNER_TEMP/bdfr-certificate.der" | awk '{print toupper($1)}')"
          if [[ -z "$CERT_SHA" ]]; then
            echo "::error::Could not calculate SHA-256 of BDFR certificate."
            exit 1
          fi
          if [[ "${CERT_THUMBPRINT^^}" != "${EXPECTED_THUMBPRINT^^}" ]]; then
            echo "::error::PFX certificate thumbprint does not match the configured BDFR identity."
            exit 1
          fi
          echo "BDFR_PFX_PATH=$RUNNER_TEMP/bdfr-codesign.pfx" >> "$GITHUB_ENV"
          echo "BDFR_PFX_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "BDFR_PFX_SHA256=$CERT_SHA" >> "$GITHUB_ENV"
          echo "BDFR Android signing alias loaded: $ALIAS"
      - name: Bootstrap Flutter Android project
        run: flutter create --platforms=android --project-name rxbridge apps/mobile
      - name: Configure app label and dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          # Preserve the android: namespace prefix required by Flutter's embedding check.
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          p = Path("apps/mobile/android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(p)
          root = tree.getroot()
          app = root.find("application")
          if app is None:
              raise SystemExit("AndroidManifest.xml has no application element")
          app.set("{http://schemas.android.com/apk/res/android}label", "پل سلامت")
          tree.write(p, encoding="utf-8", xml_declaration=True)
          PY
          python3 apps/mobile/tool/configure_notifications.py
          cd apps/mobile
          flutter pub get
          flutter test
      - name: Build unsigned release APK
        run: cd apps/mobile && flutter build apk --release --build-number "$((10000 + $GITHUB_RUN_NUMBER))"
      - name: Align and sign APK with persistent BDFR PKCS12 certificate
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          mkdir -p out/signing
          cp "$BDFR_PFX_PATH" out/signing/BDFR-Android-Signing.p12
          "$BUILD_TOOLS/zipalign" -f 4 apps/mobile/build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/rxbridge-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$BDFR_PFX_PATH" \
            --ks-type PKCS12 \
            --ks-key-alias "$BDFR_PFX_ALIAS" \
            --ks-pass "pass:$PFX_PASSWORD" \
            --key-pass "pass:$PFX_PASSWORD" \
            --out out/RxBridge-Android-Signed.apk \
            "$RUNNER_TEMP/rxbridge-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs out/RxBridge-Android-Signed.apk | tee "$RUNNER_TEMP/apk-signature-report.txt"
          ACTUAL_CERT_SHA="$(grep -i 'certificate SHA-256 digest:' "$RUNNER_TEMP/apk-signature-report.txt" | tail -n1 | grep -Eo '[[:xdigit:]]{64}' | tail -n1 | tr '[:lower:]' '[:upper:]')"
          echo "Expected BDFR certificate SHA-256: ${BDFR_PFX_SHA256^^}"
          echo "Actual APK signer SHA-256: ${ACTUAL_CERT_SHA:-<not-reported>}"
          if [[ -z "$ACTUAL_CERT_SHA" || "${ACTUAL_CERT_SHA^^}" != "${BDFR_PFX_SHA256^^}" ]]; then
            echo "::error::Final APK signer does not match BDFR certificate; see signer report above."
            exit 1
          fi
          rm -f out/signing/BDFR-Android-Signing.p12 "$RUNNER_TEMP/rxbridge-aligned.apk"
          sha256sum out/RxBridge-Android-Signed.apk | tee out/signing/SHA256SUMS.txt
          keytool -exportcert -rfc -storetype PKCS12 -keystore "$BDFR_PFX_PATH" -storepass "$PFX_PASSWORD" -alias "$BDFR_PFX_ALIAS" -file out/signing/BDFR-Android-Certificate.pem
      - uses: actions/upload-artifact@v4
        with:
          name: RxBridge-Android-Signed-Release
          path: out/**
          if-no-files-found: error
          retention-days: 60
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/bdfr-codesign.pfx" "$RUNNER_TEMP/pfx-info.txt" "$RUNNER_TEMP/rxbridge-aligned.apk"
