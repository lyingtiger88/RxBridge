name: Server CI
on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/server-ci.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server-ci.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rxbridge
          POSTGRES_USER: rxbridge
          POSTGRES_PASSWORD: ci-only-placeholder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rxbridge -d rxbridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: pip install -r server/requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q server/app server
      - name: Run backend unit tests
        env:
          JWT_SECRET: ci-test-secret-with-at-least-32-characters
          DATABASE_URL: postgresql://rxbridge:ci-only-placeholder@127.0.0.1:5432/rxbridge
        run: python -m unittest discover -s server/tests -v
      - name: Apply database schema and migrations
        env:
          PGPASSWORD: ci-only-placeholder
        run: |
          psql -h 127.0.0.1 -U rxbridge -d rxbridge -v ON_ERROR_STOP=1 -f server/db/init.sql
          psql -h 127.0.0.1 -U rxbridge -d rxbridge -v ON_ERROR_STOP=1 -f server/db/002_pharmacy_network.sql
          psql -h 127.0.0.1 -U rxbridge -d rxbridge -v ON_ERROR_STOP=1 -f server/db/003_pharmacy_reservations.sql
          psql -h 127.0.0.1 -U rxbridge -d rxbridge -v ON_ERROR_STOP=1 -f server/db/004_pharmacy_audit.sql
          psql -h 127.0.0.1 -U rxbridge -d rxbridge -v ON_ERROR_STOP=1 -f server/db/005_pharmacy_orders.sql
          psql -h 127.0.0.1 -U rxbridge -d rxbridge -v ON_ERROR_STOP=1 -f server/db/006_reservation_expiry.sql
          psql -h 127.0.0.1 -U rxbridge -d rxbridge -v ON_ERROR_STOP=1 -f server/db/007_app_notifications.sql
          psql -h 127.0.0.1 -U rxbridge -d rxbridge -v ON_ERROR_STOP=1 -f server/db/008_supabase_auth_identity.sql
      - name: Run PostgreSQL API integration tests
        env:
          JWT_SECRET: ci-test-secret-with-at-least-32-characters
          DATABASE_URL: postgresql://rxbridge:ci-only-placeholder@127.0.0.1:5432/rxbridge
          RXBRIDGE_INTEGRATION_TESTS: "1"
        run: python -m unittest server.tests.test_pharmacy_reservations_api -v
      - name: Validate Compose configuration
        run: |
          printf 'POSTGRES_PASSWORD=ci-only-placeholder\nDATABASE_URL=postgresql://rxbridge:ci-only-placeholder@db:5432/rxbridge\nJWT_SECRET=ci-only-secret-with-more-than-32-characters\n' > server/.env
          docker compose -f server/docker-compose.yml config --quiet
      - name: Build backend image
        run: docker build -t rxbridge-staging-api server
