services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rxbridge}
      POSTGRES_USER: ${POSTGRES_USER:-rxbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - rxbridge_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ./db/002_pharmacy_network.sql:/docker-entrypoint-initdb.d/002-pharmacy-network.sql:ro
      - ./db/003_pharmacy_reservations.sql:/docker-entrypoint-initdb.d/003-pharmacy-reservations.sql:ro
      - ./db/004_pharmacy_audit.sql:/docker-entrypoint-initdb.d/004-pharmacy-audit.sql:ro
      - ./db/005_pharmacy_orders.sql:/docker-entrypoint-initdb.d/005-pharmacy-orders.sql:ro
      - ./db/006_reservation_expiry.sql:/docker-entrypoint-initdb.d/006-reservation-expiry.sql:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER:-rxbridge} -d ${POSTGRES_DB:-rxbridge}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
    ports: ["127.0.0.1:8000:8000"]
    networks: [backend]
volumes:
  rxbridge_pgdata:
networks:
  backend:
    internal: true
